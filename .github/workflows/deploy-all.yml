name: 'Infrastructure Orchestrator'

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          # - staging
          # - prod
      operation:
        description: 'Terraform Operation'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write # Required for OIDC if using Azure Workload Identity

jobs:
  inventory:
    name: 'Inventory: Discover Stacks'
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.discover.outputs.stacks }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Discover Stacks
        id: discover
        run: |
          # Use a more robust discovery method. 
          # We look for main.tf files to identify valid Terraform stacks.
          SEARCH_PATH="environments/${{ github.event.inputs.environment }}"
          
          if [ ! -d "$SEARCH_PATH" ]; then
            echo "Error: Environment path $SEARCH_PATH not found."
            exit 1
          fi

          # Find directories containing main.tf, relative to the environment path
          STACKS=$(find "$SEARCH_PATH" -maxdepth 2 -name "main.tf" -exec dirname {} \; | xargs -I {} basename {} | jq -R -s -c 'split("\n") | map(select(length > 0))')
          
          # Sort stacks with priority (RG first)
          SORTED_STACKS=$(echo "$STACKS" | jq -c '
            if contains(["rg"]) then 
              ["rg"] + (del(.[] | select(. == "rg")) | sort)
            else 
              sort 
            end')
          
          echo "stacks=$SORTED_STACKS" >> $GITHUB_OUTPUT

  deploy:
    name: 'Deploy: ${{ matrix.stack }}'
    needs: inventory
    strategy:
      matrix:
        stack: ${{ fromJson(needs.inventory.outputs.stacks) }}
      max-parallel: 1 # Sequential deployment for infrastructure safety
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      component: ${{ matrix.stack }}
      operation: ${{ github.event.inputs.operation }}
      # environment: ${{ github.event.inputs.environment }} # Could be passed if reusable workflow supports it
    secrets: inherit

  notify:
    name: 'Notification'
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "Environment: ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "Operation: ${{ github.event.inputs.operation }}" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
