name: 'Terraform Security and Plan'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: dev

    strategy:
      matrix:
        component: [rg, acr, aks]
      fail-fast: false # Allow other components to proceed if one fails

    defaults:
      run:
        working-directory: ./environments/dev/${{ matrix.component }}

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.3.0

    - name: Terraform Init
      run: terraform init
      env:
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    - name: Terraform Format
      run: terraform fmt -recursive ../../../

    - name: Auto-Heal Code (Format)
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "auto-heal: fix terraform formatting for ${{ matrix.component }}"
        file_pattern: "*.tf"

    - name: tfsec
      uses: aquasecurity/tfsec-action@v1.0.0
      continue-on-error: true
      with:
        working_directory: ./environments/dev/${{ matrix.component }}

    - name: Checkov
      uses: bridgecrewio/checkov-action@master
      continue-on-error: true
      with:
        directory: ./environments/dev/${{ matrix.component }}
        framework: terraform
        soft_fail: true

    - name: Terraform Plan
      run: terraform plan -var-file="dev.tfvars" -input=false
      env:
        ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
        ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
