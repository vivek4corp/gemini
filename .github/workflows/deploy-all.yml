name: 'Deploy All Components'

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation (plan or apply)'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

jobs:
  # This job dynamically finds all component directories in environments/dev
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Discover Components
        id: set-matrix
        run: |
          # Find directories, filter out 'rg', sort others, then put 'rg' at the start
          ALL_DIRS=$(ls -d environments/dev/*/ | xargs -n 1 basename)
          OTHER_DIRS=$(echo "$ALL_DIRS" | grep -v "^rg$" | sort)
          if echo "$ALL_DIRS" | grep -q "^rg$"; then
            FINAL_LIST=$(echo -e "rg\n$OTHER_DIRS")
          else
            FINAL_LIST="$OTHER_DIRS"
          fi
          
          # Convert newline-separated list to JSON array
          JSON_COMPONENTS=$(echo "$FINAL_LIST" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=$JSON_COMPONENTS" >> $GITHUB_OUTPUT

  deploy:
    needs: setup
    strategy:
      matrix:
        component: ${{ fromJson(needs.setup.outputs.matrix) }}
      # Use max-parallel: 1 if you want to ensure they run one by one
      # to avoid Terraform state lock issues or dependency failures.
      max-parallel: 1 
    uses: ./.github/workflows/terraform-reusable.yml
    with:
      component: ${{ matrix.component }}
      operation: ${{ github.event.inputs.operation }}
    secrets: inherit
